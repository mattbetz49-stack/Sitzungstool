name: Supabase wachhalten
# Das kostenlose Supabase-Projekt pausiert nach ca. 7 Tagen ohne Aktivität. Dieser Aufruf alle 3 Tage verhindert das.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/vorlage_top?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" > /dev/null
